<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phần Mềm Ghi Chú</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; padding: 10px; box-sizing: border-box;}
        input[type="text"] { width: 100%; padding: 10px; margin-bottom: 20px; box-sizing: border-box; border: 2px solid #007bff; border-radius: 5px;}
        input[type="file"] { margin-bottom: 10px; width: 100%; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold;}
        button:hover { background: #0056b3; }
        .note { border: 1px solid #ddd; padding: 15px; margin-top: 15px; background: #f9f9f9; border-radius: 5px; white-space: pre-wrap; position: relative;}
        .date { font-size: 0.8em; color: #666; margin-bottom: 10px; border-bottom: 1px solid #ccc; padding-bottom: 5px;}
        .edit-btn { position: absolute; top: 10px; right: 10px; background: #ffc107; color: #000; padding: 5px 10px; font-size: 0.8em;}
        .edit-btn:hover { background: #e0a800; }
        .cancel-btn { background: #dc3545; margin-left: 5px;}
        .cancel-btn:hover { background: #c82333; }
        .attachment { margin-top: 10px; display: inline-block; background: #e2e3e5; padding: 5px 10px; border-radius: 3px; font-size: 0.9em; text-decoration: none; color: #383d41;}
        .attachment:hover { background: #d6d8db; }
    </style>
</head>
<body>

    <h1>Ghi Chú Đám Mây ☁️📝</h1>
    
    <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm mọi thứ trong ghi chú...">
    <textarea id="noteContent" placeholder="Nhập nội dung ghi chú của bạn vào đây..."></textarea>
    <input type="file" id="fileUpload" title="Chọn tệp đính kèm">

    <div>
        <button id="saveButton">Lưu Ghi Chú</button>
        <button id="cancelEditButton" class="cancel-btn" style="display: none;">Hủy Chỉnh Sửa</button>
    </div>

    <div id="notesList"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";
        // NHẬP CÔNG CỤ FIREBASE STORAGE
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4E53KScKW8a-MPX-wnYQLuUGA88UIyfI",
            authDomain: "notevna.firebaseapp.com",
            projectId: "notevna",
            storageBucket: "notevna.firebasestorage.app",
            messagingSenderId: "423178381098",
            appId: "1:423178381098:web:574715974de58edd806053"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app); // Khởi tạo Storage

        const saveButton = document.getElementById('saveButton');
        const cancelEditButton = document.getElementById('cancelEditButton');
        const noteContent = document.getElementById('noteContent');
        const fileUpload = document.getElementById('fileUpload');
        const notesList = document.getElementById('notesList');
        const searchInput = document.getElementById('searchInput');

        let allNotes = [];
        let editingNoteId = null; 

        saveButton.addEventListener('click', async () => {
            const text = noteContent.value;
            const file = fileUpload.files[0];
            
            if (text.trim() === "" && !file) {
                alert("Vui lòng nhập nội dung hoặc chọn tệp tin!");
                return;
            }

            saveButton.innerText = "Đang lưu...";
            saveButton.disabled = true;
            
            let fileUrlToSave = "";

            try {
                // TẢI TỆP LÊN FIREBASE STORAGE NẾU CÓ TỆP
                if (file) {
                    saveButton.innerText = "Đang tải tệp lên...";
                    // Tạo tên tệp độc nhất để không bị trùng lặp
                    const uniqueFileName = new Date().getTime() + "_" + file.name;
                    const storageRef = ref(storage, 'uploads/' + uniqueFileName);

                    // Đẩy tệp lên Firebase
                    await uploadBytes(storageRef, file);
                    // Lấy đường link của tệp vừa tải
                    fileUrlToSave = await getDownloadURL(storageRef);
                }

                if (editingNoteId) {
                    // CẬP NHẬT GHI CHÚ
                    const noteRef = doc(db, "notes", editingNoteId);
                    const updateData = { text: text, updatedAt: new Date().getTime() };
                    if (fileUrlToSave) updateData.fileUrl = fileUrlToSave;

                    await updateDoc(noteRef, updateData);
                    editingNoteId = null;
                    cancelEditButton.style.display = "none";
                } else {
                    // TẠO GHI CHÚ MỚI
                    await addDoc(collection(db, "notes"), {
                        text: text,
                        fileUrl: fileUrlToSave,
                        createdAt: new Date().getTime(),
                        fileName: file ? file.name : "" // Lưu thêm tên tệp gốc
                    });
                }
                
                noteContent.value = "";
                fileUpload.value = ""; 
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Lỗi! Chưa lưu được dữ liệu. Vui lòng kiểm tra quyền truy cập Storage.");
            }
            
            saveButton.innerText = "Lưu Ghi Chú";
            saveButton.disabled = false;
        });

        cancelEditButton.addEventListener('click', () => {
            editingNoteId = null;
            noteContent.value = "";
            fileUpload.value = "";
            saveButton.innerText = "Lưu Ghi Chú";
            cancelEditButton.style.display = "none";
        });

        // TẢI VÀ HIỂN THỊ GHI CHÚ
        const q = query(collection(db, "notes"), orderBy("createdAt", "desc"));
        
        onSnapshot(q, (snapshot) => {
            allNotes = [];
            snapshot.forEach((documentSnapshot) => {
                allNotes.push({ id: documentSnapshot.id, ...documentSnapshot.data() });
            });
            renderNotes(allNotes);
        });

        function renderNotes(notesToDisplay) {
            notesList.innerHTML = "";
            notesToDisplay.forEach(note => {
                const createdDate = new Date(note.createdAt).toLocaleString('vi-VN');
                const updatedText = note.updatedAt ? ` (Đã sửa lúc: ${new Date(note.updatedAt).toLocaleString('vi-VN')})` : '';
                
                // Hiển thị tên tệp gốc thay vì chữ "Xem tệp đính kèm" chung chung
                const displayFileName = note.fileName ? note.fileName : "Tệp đính kèm";
                const attachmentHtml = note.fileUrl 
                    ? `<br><a href="${note.fileUrl}" target="_blank" class="attachment">📎 ${displayFileName}</a>` 
                    : '';

                const div = document.createElement('div');
                div.className = 'note';
                div.innerHTML = `
                    <div class="date">🗓️ Lưu lúc: ${createdDate} ${updatedText}</div>
                    <div>${note.text}</div>
                    ${attachmentHtml}
                    <button class="edit-btn" data-id="${note.id}" data-text="${note.text.replace(/"/g, '&quot;')}">Sửa</button>
                `;
                notesList.appendChild(div);
            });

            document.querySelectorAll('.edit-btn').forEach(button => {
                button.addEventListener('click', (e) => {
                    const id = e.target.getAttribute('data-id');
                    const text = e.target.getAttribute('data-text');
                    
                    noteContent.value = text;
                    editingNoteId = id; 
                    
                    saveButton.innerText = "Cập nhật Ghi Chú";
                    cancelEditButton.style.display = "inline-block";
                    window.scrollTo(0, 0); 
                });
            });
        }

        // TÌM KIẾM
        searchInput.addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            const filteredNotes = allNotes.filter(note => 
                note.text.toLowerCase().includes(keyword)
            );
            renderNotes(filteredNotes);
        });
    </script>
</body>
</html>
